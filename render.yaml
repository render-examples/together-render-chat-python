services:
  - type: web
    name: together-chat-python
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TOGETHER_API_KEY
        sync: false
      - key: CHAT_API_KEY
        sync: false
      - key: TOGETHER_MODEL
        value: Qwen/Qwen3.5-9B
      - key: PYTHON_VERSION
        value: 3.14.3
